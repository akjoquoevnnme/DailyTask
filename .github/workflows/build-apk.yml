name: Build DailyTask APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out your fork
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'

      - name: Install project build dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" \
            "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Build release APK with the repository signing configuration
        run: |
          chmod +x gradlew
          # Keep Gradle 8.13; change only its download host for this cloud build.
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DailyTask-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
